# Like SonicTerm: only a pushed tag v<x.y.z>[-pre] (matching Cargo.toml) on a
# main commit whose ci passed releases: 3 zips + SHA256SUMS. A tag with a "-"
# is a prerelease. Nothing runs this by hand, so nothing can publish off a tag.
# GitHub registers a fork's workflow only once a push changes its file.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
env: { RUST_TOOLCHAIN: 1.95.0, ZIG_VERSION: 0.16.0 }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Tag matches Cargo.toml
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$GITHUB_SHA^{commit}" refs/remotes/origin/main
      - name: No Herdr release switch (no telemetry, no self-update)
        run: "! grep -rn 'HERDR_APP_''RELEASE[=:]' scripts .github"
  build:
    needs: [validate, ci-passed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, runner: macos-15, arch: arm64 }
          - { platform: macos-x86_64, runner: macos-15-intel, arch: x86_64 }
          - { platform: windows-x86_64, runner: windows-2022, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: true, persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with: { version: "${{ env.ZIG_VERSION }}" }
      - if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - run: scripts/package
      - name: Check the macOS bundle (no window)
        if: runner.os == 'macOS'
        run: |
          x=$(mktemp -d); ditto -x -k dist/apollo-app-*-macos-*.zip "$x"; a="$x/Apollo.app"
          test "$(plutil -extract CFBundleIdentifier raw "$a/Contents/Info.plist")" = com.foryouzi.apollo
          test "$(plutil -extract CFBundleIconName raw "$a/Contents/Info.plist")" = Apollo
          cmp assets/icons/Assets.car "$a/Contents/Resources/Assets.car"
          test "$(lipo -archs "$a/Contents/MacOS/Apollo")" = "${{ matrix.arch }}"
          codesign -v "$a"
          HERDR_APP_HOME="$x/home" "$a/Contents/MacOS/Apollo" --version | grep -qx "herdr-app $(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - name: Check the Windows zip (no window)
        if: runner.os == 'Windows'
        run: |
          x=$(mktemp -d); 7z x -o"$x" dist/apollo-app-*-windows-x86_64.zip >/dev/null
          HERDR_APP_HOME="$x/home" "$x/apollo-app/apollo-app.exe" --version | grep -q "^herdr-app "
          HERDR_APP_HOME="$x/home" "$x/apollo-app/herdr-app.exe" --version | grep -q "^herdr-app "
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "${{ matrix.platform }}", path: dist/apollo-app-*.zip, if-no-files-found: error }
  # ci.yml runs on pushes to main (and PRs), never on tags: tag a main commit
  # whose ci passed. This waits for that push run on the tagged SHA.
  # A newer push cancels it: rerun it and this job carries on.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { actions: read }
    steps:
      - name: Wait for ci on this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"') || run="api error"
            echo "ci for $GITHUB_SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              "completed cancelled "*) echo "cancelled by a newer push: rerun that ci run, this job keeps waiting" ;;
              completed*) exit 1 ;;
            esac
            sleep 30
          done
  publish:
    needs: [build, ci-passed]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum apollo-app-*.zip > SHA256SUMS && cat SHA256SUMS && test "$(wc -l < SHA256SUMS)" -eq 3
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          kind=--latest; [[ "$GITHUB_REF_NAME" == *-* ]] && kind=--prerelease
          gh release create "$GITHUB_REF_NAME" dist/apollo-app-*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" --title "Apollo ${GITHUB_REF_NAME#v}" --notes "Apollo ${GITHUB_REF_NAME#v}. macOS builds are ad-hoc signed; see README for first launch."
